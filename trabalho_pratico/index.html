<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestão de Estoque</title>
</head>

<body>

    <div class="app-container">

        <header>
            <h1>Gestão de Estoque</h1> 
            <img class ="imagem_irada" src="imagens/frutiger_aero_characters.png" width="100" height="100"> 
        </header>

        <main class="dashboard">

            <!-- CADASTRO DE PRODUTO -->
            <section class="Cadastro">
                <h2>Cadastro de Produto</h2>

                <form class="panel-form"
                      action="salvar_produto.php"
                      method="POST">

                    <div class="fields">
                        <label for="cod-cadastro">
                            Código do Produto
                        </label>
                        <input id="cod-cadastro"
                               name="cod_produto"
                               type="text"
                               required
                               maxlength="10">

                        <label for="desc-produto">
                            Descrição do Produto
                        </label>
                        <input id="desc-produto"
                               name="desc_produto"
                               type="text"
                               required
                               maxlength="100">
                    </div>

                    <button type="submit">
                        Cadastrar Produto
                    </button>
                </form>
            </section>

            <!-- MOVIMENTAÇÃO -->
            <section class="Cadastro">
                <h2>Movimentação</h2>

                <form class="panel-form"
                      action="salvar_movimentacao.php"
                      method="POST">

                    <div class="fields">
                        <label for="cod-movimentacao">
                            Código do Produto
                        </label>
                        <input id="cod-movimentacao"
                               name="cod_produto"
                               type="text"
                               required
                               maxlength="10">

                        <label for="tipo">
                            Tipo de Movimentação
                        </label>
                        <select id="tipo" name="tipo" required>
                            <option value="E">Entrada</option>
                            <option value="S">Saída</option>
                        </select>

                        <label for="quantidade">
                            Quantidade
                        </label>
                        <input id="quantidade"
                               name="quantidade"
                               type="number"
                               min="1"
                               required>
                    </div>

                    <button type="submit">
                        Registrar Movimentação
                    </button>
                </form>
            </section>

            <!-- CONSULTAS -->
            <section class="Cadastro">
                <h2>Consultas</h2>

                <div class="consult-field">
                    <label for="cod-consulta">
                        Código do Produto (Opcional)
                    </label>

                    <input id="cod-consulta"
                           form="form-produtos"
                           name="cod_produto"
                           type="text"
                           maxlength="10"
                           placeholder="Digite o código">
                </div>

                <div class="consult-actions">

                    <form action="consultar_movimentacao.php"
                          method="GET">
                        <button type="submit">
                            Consultar Movimentações
                        </button>
                    </form>

                    <form action="consultar_estoque.php"
                          method="GET">
                        <button type="submit">
                            Consultar Estoque
                        </button>
                    </form>

                    <form id="form-produtos"
                          action="consultar_produtos.php"
                          method="GET">
                        <button type="submit">
                            Consultar Produtos
                        </button>
                    </form>

                </div>
            </section>

        </main>
    </div>

</body>
</html>
